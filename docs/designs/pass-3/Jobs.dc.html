<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peacock jobs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--bg:#0F1115;--surface:#171A21;--surface-2:#1E222B;--border:#262A33;--text:#E6E8EC;--muted:#9BA1AD;--accent:#7C8CFF;--on-accent:#0F1115;--ok:#3FB68B;--warn:#E0A340;--err:#E5636B;--info:#6FA8FF}
body{margin:0}
a{color:var(--accent)}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <header style="display: flex; align-items: center; gap: 6px; height: 56px; padding: 0 8px; border-bottom: 1px solid var(--border)">
    <button aria-label="Open menu" style="width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: var(--text); flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    <label for="q" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 44px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 10px; box-sizing: border-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" placeholder="Search" aria-label="Search or run a command" style="flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text); font: inherit; outline: none">
    </label>
    <button aria-label="Notifications, 3 unread" style="width: 44px; height: 44px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--text); position: relative; flex: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 004 0"></path></svg>
      <span style="position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--err); color: var(--on-accent); font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 4px; box-sizing: border-box">3</span>
    </button>
    <button aria-label="Account menu" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; font-size: 13px; font-weight: 600; flex: none">SK</button>
  </header>
  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <h1 style="margin: 0; font-size: 20px; font-weight: 600">Jobs</h1>
    <div style="font-size: 12px; color: var(--muted); letter-spacing: .04em">RUNNING</div>
    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="flex: 1; font-weight: 600">Move Media player to a new host</div>
        <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--surface-2); color: var(--info); font-size: 13px; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"></path></svg>Step 3 of 5</span>
      </div>
      <div role="progressbar" aria-label="Move Media player progress" aria-valuenow="52" aria-valuemin="0" aria-valuemax="100" style="height: 6px; border-radius: 3px; background: var(--surface-2)"><div style="width: 52%; height: 6px; border-radius: 3px; background: var(--accent)"></div></div>
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{s.c}}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="{{s.d}}"></path></svg>
          <span>{{s.t}}</span>
        </div>
      </sc-for>
      <div style="display: flex; gap: 8px">
        <button style="min-height: 44px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: var(--accent); font: inherit">View log</button>
        <div style="flex: 1"></div>
        <button aria-expanded="true" aria-controls="cancel-sheet" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--err); background: transparent; color: var(--err); font: inherit">Cancel job</button>
      </div>
    </div>
    <div style="font-size: 12px; color: var(--muted); letter-spacing: .04em; margin-top: 4px">RECENT</div>
    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden">
      <sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
        <a href="#" style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 14px; border-top: 1px solid var(--border); color: var(--text); text-decoration: none; box-sizing: border-box">
          <span style="flex: 1; min-width: 0"><span style="display: block">{{r.t}}</span><span style="display: block; font-size: 12px; color: var(--muted)">{{r.w}}</span></span>
          <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--surface-2); color: {{r.c}}; font-size: 13px; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="{{r.d}}"></path></svg>{{r.s}}</span>
        </a>
      </sc-for>
    </div>
  </div>
  <sc-if value="{{showCancel}}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--bg); opacity: .6"></div>
    <div id="cancel-sheet" role="alertdialog" aria-modal="true" aria-labelledby="cs-t" aria-describedby="cs-d" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 12px">
      <div aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--border)"></div>
      <h2 id="cs-t" style="margin: 0; font-size: 17px; font-weight: 600">Cancel this move?</h2>
      <div id="cs-d" style="font-size: 13px; color: var(--muted)">It stops after the current step and rolls back the 2 finished steps. Media player stays on its current host and keeps running.</div>
      <button style="min-height: 48px; border-radius: 10px; border: 0; background: var(--err); color: var(--on-accent); font: inherit; font-weight: 600">Stop and roll back</button>
      <button style="min-height: 48px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text); font: inherit">Keep running</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showCancel":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const ok = 'M5 12l5 5L20 7', fail = 'M6 6l12 12M18 6L6 18';
return {
showCancel: this.props.showCancel ?? true,
steps: [
{t: 'Check the new host has room', c: 'var(--ok)', d: ok},
{t: 'Stop Media player', c: 'var(--ok)', d: ok},
{t: 'Copy settings and metadata', c: 'var(--info)', d: 'M21 12a9 9 0 11-3-6.7'},
{t: 'Start on the new host', c: 'var(--muted)', d: 'M8 12h8'},
{t: 'Check it plays', c: 'var(--muted)', d: 'M8 12h8'}
],
recent: [
{t: 'Nightly backups', w: 'Finished 03:12 · 41 min', s: 'Healthy', c: 'var(--ok)', d: ok},
{t: 'Fix storage mount', w: 'Failed 11:40 · rolled back', s: 'Failed', c: 'var(--err)', d: fail},
{t: 'Update 2 plugins', w: 'Finished yesterday 22:05', s: 'Healthy', c: 'var(--ok)', d: ok},
{t: 'Renew mesh certificate', w: 'Cancelled Nov 24 · rolled back', s: 'Idle', c: 'var(--muted)', d: 'M9 7v10M15 7v10'}
]
};
}
}
</script>
</body>
</html>
