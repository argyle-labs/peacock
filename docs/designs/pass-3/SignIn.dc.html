<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--bg:#0F1115;--surface:#171A21;--surface-2:#1E222B;--border:#262A33;--text:#E6E8EC;--muted:#9BA1AD;--accent:#7C8CFF;--on-accent:#0F1115;--ok:#3FB68B;--warn:#E0A340;--err:#E5636B;--info:#6FA8FF}
body{margin:0}
a{color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-mask-image:linear-gradient(90deg,black 85%,transparent)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column">
  <header style="height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 20px; border-bottom: 1px solid var(--border); flex: none">
    <h1 style="flex: 1; margin: 0; font-weight: 600; font-size: 16px">Sign in</h1>
  </header>
  <div style="flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px">
    <div style="font-size: 14px; color: var(--muted)">Signing in as <span style="color: var(--text)">scott@example.com</span> · <a href="#" style="display: inline-flex; align-items: center; min-height: 44px">Not you?</a></div>
    <div><div style="font-size: 22px; font-weight: 600">Enter your authenticator code</div><div style="font-size: 14px; color: var(--muted); margin-top: 4px">Two-factor is on for this account. Open your authenticator app for the 6-digit code.</div></div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="otp" style="font-size: 13px; color: var(--muted)">6-digit code</label>
      <input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" aria-invalid="{{bad}}" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; height: 56px; font-size: 24px; letter-spacing: .5em; text-align: center; border-color: {{border}}" value="">
      <sc-if value="{{bad}}" hint-placeholder-val="{{ false }}">
        <div role="alert" style="display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--err)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg><span>That code did not match. Try the newest code.</span></div>
      </sc-if>
    </div>
    <label style="display: flex; align-items: center; gap: 12px; min-height: 44px"><input type="checkbox" style="width: 22px; height: 22px; accent-color: var(--accent)"><span>Trust this device for 30 days</span></label>
    <a href="#" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 14px">Use a recovery code instead</a>
  </div>
  <div style="padding: 12px 24px 24px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px">
    <button style="height: 50px; border-radius: 10px; border: 0; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600">Verify</button>
    <button style="height: 44px; border: 0; background: transparent; color: var(--accent); font: inherit; font-weight: 500">Back to password</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"select","default":"empty","options":["empty","wrong-code"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const bad = (this.props.state ?? 'empty') === 'wrong-code';
return { bad: bad, border: bad ? 'var(--err)' : 'var(--border)' };
}
}
</script>
</body>
</html>
