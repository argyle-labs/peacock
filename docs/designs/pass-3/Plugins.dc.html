<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peacock plugins catalog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--bg:#0F1115;--surface:#171A21;--surface-2:#1E222B;--border:#262A33;--text:#E6E8EC;--muted:#9BA1AD;--accent:#7C8CFF;--on-accent:#0F1115;--ok:#3FB68B;--warn:#E0A340;--err:#E5636B;--info:#6FA8FF}
body{margin:0}
a{color:var(--accent)}
</style>
</helmet>
<div style="width: 1280px; height: 860px; display: flex; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 14px; overflow: hidden">
  <nav aria-label="Main" style="width: 248px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 12px; gap: 2px; box-sizing: border-box">
    <button aria-label="Switch mesh" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 10px; margin-bottom: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; text-align: left">
      <span style="width: 24px; height: 24px; border-radius: 6px; background: var(--accent)"></span>
      <span style="flex: 1"><span style="display: block; font-weight: 600">home</span><span style="display: block; font-size: 12px; color: var(--muted)">9 systems · 1 down</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div>
        <div style="font-size: 12px; color: var(--muted); padding: 12px 12px 4px; letter-spacing: .04em">{{g.name}}</div>
        <sc-for list="{{g.items}}" as="i" hint-placeholder-count="6">
          <a href="#" aria-current="{{i.cur}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 8px; background: {{i.bg}}; color: var(--text); text-decoration: none"><span>{{i.n}}</span><span style="font-size: 12px; color: {{i.c}}">{{i.b}}</span></a>
        </sc-for>
      </div>
    </sc-for>
    <div style="flex: 1"></div>
    <a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--text); text-decoration: none">Account</a>
    <a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--text); text-decoration: none">Settings</a>
    <button aria-label="Collapse sidebar" style="width: 44px; height: 44px; margin-top: 4px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--muted)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path><path d="M15 10l-2 2 2 2"></path></svg>
    </button>
  </nav>
  <main style="flex: 1; display: flex; flex-direction: column; min-width: 0">
    <header style="height: 64px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 24px; flex: none">
      <label for="q" style="flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; max-width: 680px; box-sizing: border-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="q" placeholder="Search or run a command" aria-label="Search or run a command" style="flex: 1; background: transparent; border: 0; color: var(--text); font: inherit; outline: none">
        <span style="font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px">Ctrl K</span>
      </label>
      <div style="flex: 1"></div>
      <button aria-label="Notifications, 3 unread" style="width: 44px; height: 44px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--text); position: relative">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 004 0"></path></svg>
        <span style="position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--err); color: var(--on-accent); font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 4px; box-sizing: border-box">3</span>
      </button>
      <button aria-label="Account menu" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; font-size: 13px; font-weight: 600">SK</button>
    </header>
    <div style="flex: 1; display: flex; min-height: 0">
      <section style="flex: 1; min-width: 0; padding: 20px 32px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <h1 style="margin: 0; font-size: 20px; font-weight: 600">Plugins</h1>
          <div role="tablist" aria-label="Plugin views" style="display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px">
            <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
              <button role="tab" aria-selected="{{t.on}}" style="min-height: 38px; padding: 0 14px; border-radius: 8px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-size: 13px">{{t.n}}</button>
            </sc-for>
          </div>
        </div>
        <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px">
          <div style="font-size: 12px; color: var(--muted); letter-spacing: .04em; margin-bottom: 10px">SUGGESTED FOR YOUR NETWORK</div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
            <sc-for list="{{suggested}}" as="s" hint-placeholder-count="3">
              <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--info)" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M5 12a7 7 0 0114 0"></path><path d="M2 12a10 10 0 0120 0"></path></svg>
                <div style="flex: 1; min-width: 0"><div style="font-weight: 500">{{s.cat}}</div><div style="font-size: 12px; color: var(--muted)">{{s.sub}}</div></div>
                <button style="min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); font: inherit; font-size: 13px">Review</button>
              </div>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; gap: 12px; align-items: center">
          <label for="pf" style="flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; box-sizing: border-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
            <input id="pf" placeholder="Filter plugins" aria-label="Filter plugins" style="flex: 1; background: transparent; border: 0; color: var(--text); font: inherit; outline: none">
          </label>
          <label for="cat" style="font-size: 13px; color: var(--muted)">Category</label>
          <select id="cat" style="height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; padding: 0 10px"><option>All categories</option><option>Media player</option><option>Password manager</option><option>Storage</option><option>Network</option><option>Notification channel</option></select>
          <label for="src" style="font-size: 13px; color: var(--muted)">Source</label>
          <select id="src" style="height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; padding: 0 10px"><option>All sources</option><option>argyle-labs</option><option>community</option></select>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
          <sc-for list="{{plugins}}" as="p" hint-placeholder-count="9">
            <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                <span style="font-size: 12px; color: var(--muted)">{{p.cat}}</span>
                <span style="display: inline-flex; align-items: center; gap: 4px; color: {{p.sigColor}}; font-size: 12px">
                  <sc-if value="{{p.signed}}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg></sc-if>
                  <sc-if value="{{p.unsigned}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v4M12 17v.5"></path></svg></sc-if>
                  {{p.sig}}
                </span>
              </div>
              <div style="font-weight: 600">{{p.name}}</div>
              <div style="display: flex; align-items: center; justify-content: space-between">
                <span style="font-size: 12px; color: var(--muted)">{{p.src}}</span>
                <button style="min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; font-size: 13px">{{p.action}}</button>
              </div>
            </div>
          </sc-for>
        </div>
      </section>
      <aside aria-label="Sources" style="width: 280px; border-left: 1px solid var(--border); padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <h2 style="margin: 0; font-size: 15px; font-weight: 600">Sources</h2>
          <span style="font-size: 12px; color: var(--muted)">2 registered</span>
        </div>
        <sc-for list="{{sources}}" as="s" hint-placeholder-count="2">
          <div style="border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--surface)">
            <div style="font-weight: 500">{{s.name}}</div>
            <div style="font-size: 12px; color: var(--muted); margin: 2px 0 8px">{{s.count}}</div>
            <span style="display: inline-flex; align-items: center; gap: 4px; color: {{s.color}}; font-size: 12px">
              <sc-if value="{{s.signed}}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg></sc-if>
              <sc-if value="{{s.unsigned}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v4M12 17v.5"></path></svg></sc-if>
              {{s.status}}
            </span>
            <sc-if value="{{s.unsigned}}" hint-placeholder-val="{{ false }}">
              <p style="margin: 8px 0 0; font-size: 12px; color: var(--muted)">Plugins from this source can't be verified. Each install asks you to confirm.</p>
            </sc-if>
          </div>
        </sc-for>
        <button style="min-height: 44px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); font: inherit; font-size: 13px">Add source</button>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const i = (n, b, c, cur) => ({n, b: b || '', c: c || 'var(--muted)', cur: cur ? 'page' : 'false', bg: cur ? 'var(--surface-2)' : 'transparent'});
const tab = (n, on) => ({n, on: on ? 'true' : 'false', bg: on ? 'var(--surface-2)' : 'transparent', fg: on ? 'var(--text)' : 'var(--muted)'});
const p = (cat, name, src, signed, action) => ({cat, name, src, signed, unsigned: !signed, sig: signed ? 'Signed' : 'Unsigned', sigColor: signed ? 'var(--ok)' : 'var(--warn)', action: action || 'Install'});
return {
groups: [
{name: 'DASHBOARDS', items: [i('Home control'), i('Media')]},
{name: 'MANAGE', items: [i('Topology'), i('Inventory'), i('Plugins', '2 updates', 'var(--info)', true), i('Backups', '2 gaps', 'var(--warn)'), i('Jobs'), i('People')]},
{name: 'SHARED', items: [i('Family')]}
],
tabs: [tab('Installed'), tab('Discover', true)],
suggested: [
{cat: 'Home automation · Home Assistant', sub: 'Detected on the network'},
{cat: 'Storage · Unraid', sub: 'Detected on 2 systems'},
{cat: 'DNS filtering · AdGuard', sub: 'Detected on the gateway'}
],
plugins: [
p('Media player', 'Jellyfin', 'argyle-labs', true),
p('Media player', 'Navidrome', 'argyle-labs', true),
p('Password manager', '1Password', 'argyle-labs', true),
p('Password manager', 'Vaultwarden', 'community', false),
p('Storage', 'Unraid', 'argyle-labs', true),
p('Storage', 'S3-compatible', 'argyle-labs', true, 'Installed'),
p('Network', 'Tailscale', 'argyle-labs', true),
p('Network', 'OpenWRT', 'community', false),
p('Notification channel', 'ntfy', 'argyle-labs', true)
],
sources: [
{name: 'argyle-labs', count: '38 plugins', signed: true, unsigned: false, status: 'Signed publisher', color: 'var(--ok)'},
{name: 'community', count: '12 plugins', signed: false, unsigned: true, status: 'Unsigned', color: 'var(--warn)'}
]
};
}
}
</script>
</body>
</html>
