<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peacock home control</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--bg:#0F1115;--surface:#171A21;--surface-2:#1E222B;--border:#262A33;--text:#E6E8EC;--muted:#9BA1AD;--accent:#7C8CFF;--on-accent:#0F1115;--ok:#3FB68B;--warn:#E0A340;--err:#E5636B;--info:#6FA8FF}
body{margin:0}
a{color:var(--accent)}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--border)">
    <button aria-label="Open menu" style="width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: var(--text)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    <div style="flex: 1"></div>
    <button aria-label="Search or run a command" style="width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: var(--text)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
    <button aria-label="Notifications, 3 unread" style="width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: var(--text); position: relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 004 0"></path></svg><span style="position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--err); color: var(--on-accent); font-size: 10px; font-weight: 600; line-height: 16px">3</span></button>
    <button aria-label="Account menu" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 13px; font-weight: 600">SK</button>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 8px">
      <h1 style="margin: 0; font-size: 20px; font-weight: 600; flex: 1">Home control</h1>
      <button aria-label="Edit dashboard" style="width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: var(--muted)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg></button>
    </div>

    <div role="toolbar" aria-label="Scenes" style="display: flex; gap: 8px; overflow-x: auto">
      <sc-for list="{{scenes}}" as="s" hint-placeholder-count="4">
        <button style="flex: none; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" aria-hidden="true"><path d="{{s.d}}"></path></svg>{{s.n}}</button>
      </sc-for>
    </div>

    <section aria-label="Now playing" style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 56px; height: 56px; border-radius: 8px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--muted)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg></div>
        <div style="flex: 1; min-width: 0"><div style="font-size: 12px; color: var(--muted)">{{media.device}}</div><div style="font-weight: 600">{{media.title}}</div><div style="font-size: 12px; color: var(--muted)">{{media.pos}}</div></div>
      </div>
      <div role="progressbar" aria-label="Playback position" aria-valuenow="59" aria-valuemin="0" aria-valuemax="100" style="height: 4px; border-radius: 2px; background: var(--surface-2)"><div style="width: 59%; height: 4px; border-radius: 2px; background: var(--accent)"></div></div>
      <div style="display: flex; gap: 8px; justify-content: center">
        <button aria-label="Previous" style="width: 56px; height: 44px; border-radius: 10px; border: 0; background: var(--surface-2); color: var(--text)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6L9 12l9 6zM6 6v12"></path></svg></button>
        <button aria-label="Pause" style="width: 64px; height: 44px; border-radius: 10px; border: 0; background: var(--accent); color: var(--on-accent)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 6v12M15 6v12"></path></svg></button>
        <button aria-label="Next" style="width: 56px; height: 44px; border-radius: 10px; border: 0; background: var(--surface-2); color: var(--text)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l9 6-9 6zM18 6v12"></path></svg></button>
      </div>
    </section>

    <section aria-labelledby="w-lights" style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px 4px">
      <div style="display: flex; align-items: center"><h2 id="w-lights" style="margin: 0; font-size: 14px; font-weight: 600; flex: 1">Living room lights</h2><span style="font-size: 12px; color: var(--muted)">3 of 4 on</span></div>
      <sc-for list="{{lights}}" as="l" hint-placeholder-count="4">
        <label style="display: flex; align-items: center; gap: 12px; min-height: 44px"><span style="flex: 1">{{l.n}}</span><span style="font-size: 12px; color: var(--muted)">{{l.lvl}}</span><input type="checkbox" role="switch" checked="{{l.on}}" style="width: 22px; height: 22px; accent-color: var(--accent)"></label>
      </sc-for>
    </section>

    <div style="display: flex; gap: 12px">
      <section aria-labelledby="w-climate" style="flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px">
        <h2 id="w-climate" style="margin: 0; font-size: 14px; font-weight: 600">Climate</h2>
        <div style="font-size: 28px; font-weight: 500">21.5&#176;</div>
        <div style="font-size: 12px; color: var(--muted)">Heat · now 20.8&#176;</div>
        <div style="display: flex; gap: 6px"><button aria-label="Lower target temperature" style="flex: 1; height: 44px; border-radius: 10px; border: 0; background: var(--surface-2); color: var(--text); font-size: 18px">&#8722;</button><button aria-label="Raise target temperature" style="flex: 1; height: 44px; border-radius: 10px; border: 0; background: var(--surface-2); color: var(--text); font-size: 18px">+</button></div>
      </section>
      <section aria-labelledby="w-door" style="flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; gap: 6px"><h2 id="w-door" style="margin: 0; font-size: 14px; font-weight: 600; flex: 1">Front door</h2><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" aria-label="View only" role="img"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 018 0v4"></path></svg></div>
        <div style="font-size: 28px; font-weight: 500">Locked</div>
        <div style="font-size: 12px; color: var(--muted)">Since 22:40 · view only</div>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
scenes: [
{n:'Movie night',d:'M8 5v14l11-7z'},
{n:'Relax',d:'M12 3a9 9 0 109 9 7 7 0 01-9-9z'},
{n:'Good night',d:'M20 14A8 8 0 1110 4a6 6 0 0010 10z'},
{n:'All off',d:'M12 3v9M6.3 7a8 8 0 1011.4 0'}
],
media: {device:'Apple TV · Living room',title:'Severance · S2 E4',pos:'31:12 of 52:40'},
lights: [
{n:'Ceiling',lvl:'40%',on:true},
{n:'Floor lamp',lvl:'60%',on:true},
{n:'TV backlight',lvl:'30%',on:true},
{n:'Reading light',lvl:'Off',on:false}
]
};
}
}
</script>
</body>
</html>
