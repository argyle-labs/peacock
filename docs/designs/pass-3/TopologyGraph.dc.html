<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Topology graph</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--bg:#0F1115;--surface:#171A21;--surface-2:#1E222B;--border:#262A33;--text:#E6E8EC;--muted:#9BA1AD;--accent:#7C8CFF;--on-accent:#0F1115;--ok:#3FB68B;--warn:#E0A340;--err:#E5636B;--info:#6FA8FF}
body{margin:0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1280px; height: 860px; display: flex; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 14px; overflow: hidden">
  <nav aria-label="Main" style="width: 248px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 12px; gap: 2px; box-sizing: border-box">
    <div style="margin-bottom: 12px">
      <button aria-label="Switch mesh" style="width: 100%; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); text-align: left">
        <span style="width: 24px; height: 24px; border-radius: 6px; background: var(--accent)"></span>
        <span style="flex: 1"><span style="display: block; font-weight: 600">home</span><span style="display: block; font-size: 12px; color: var(--muted)">9 systems · 1 down</span></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div>
        <div style="font-size: 12px; color: var(--muted); padding: 12px 12px 4px; letter-spacing: .04em">{{g.name}}</div>
        <sc-for list="{{g.items}}" as="i" hint-placeholder-count="4">
          <a href="#" aria-current="{{i.cur}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 8px; background: {{i.bg}}; color: var(--text); text-decoration: none"><span>{{i.n}}</span><span style="font-size: 12px; color: {{i.c}}">{{i.b}}</span></a>
        </sc-for>
      </div>
    </sc-for>
    <div style="flex: 1"></div>
    <a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--text); text-decoration: none">Account</a>
    <a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--text); text-decoration: none">Settings</a>
    <button aria-label="Collapse sidebar" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path><path d="M15 10l-2 2 2 2"></path></svg>
      Collapse
    </button>
  </nav>
  <main style="flex: 1; display: flex; flex-direction: column; min-width: 0">
    <header style="height: 64px; flex: none; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 24px; box-sizing: border-box">
      <label for="q" style="flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; max-width: 560px; box-sizing: border-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="q" placeholder="Search or run a command" aria-label="Search or run a command" style="flex: 1; background: transparent; border: 0; color: var(--text); font: inherit; outline: none">
        <span style="font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px">Ctrl K</span>
      </label>
      <div style="flex: 1"></div>
      <button aria-label="Notifications, 3 unread" style="width: 44px; height: 44px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--text); position: relative">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 004 0"></path></svg>
        <span style="position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--err); color: var(--on-accent); font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 4px; box-sizing: border-box">3</span>
      </button>
      <button aria-label="Account menu" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 13px; font-weight: 600">SK</button>
    </header>

    <div role="toolbar" aria-label="Topology view" style="height: 60px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--border); box-sizing: border-box">
      <h1 style="margin: 0; font-size: 20px; font-weight: 600">Topology</h1>
      <div role="tablist" aria-label="View" style="display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 2px">
        <button role="tab" aria-selected="false" style="height: 40px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: var(--muted)">Tree</button>
        <button role="tab" aria-selected="true" style="height: 40px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--surface-2); color: var(--text)">Graph</button>
      </div>
      <div style="flex: 1"></div>
      <div style="display: flex; align-items: center; border: 1px solid var(--border); border-radius: 10px; background: var(--surface)">
        <button aria-label="Zoom out" style="width: 44px; height: 42px; border: 0; background: transparent; color: var(--text)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
        <span style="font-size: 12px; color: var(--muted); width: 36px; text-align: center">65%</span>
        <button aria-label="Zoom in" style="width: 44px; height: 42px; border: 0; background: transparent; color: var(--text)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
        <button aria-label="Fit to screen" style="width: 44px; height: 42px; border: 0; border-left: 1px solid var(--border); background: transparent; color: var(--text)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
      </div>
    </div>

    <div style="flex: 1; display: flex; min-height: 0">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <div role="alert" style="margin: 12px 16px 0; padding: 6px 6px 6px 12px; background: var(--surface); border: 1px solid var(--err); border-radius: 10px; display: flex; align-items: center; gap: 10px; flex: none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--err)" stroke-width="2.5" aria-hidden="true"><path d="M12 3a9 9 0 110 18a9 9 0 010-18zM12 8v5M12 16v.5"></path></svg>
        <div style="flex: 1; min-width: 0; font-size: 13px"><span style="font-weight: 600">willow is down</span><span style="color: var(--muted)"> · 2 dependents expected down</span></div>
        <button style="height: 44px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600">Review fix</button>
      </div>
      <section aria-label="Topology canvas" style="flex: 1; position: relative; overflow: hidden; background: var(--bg)">
        <div style="position: absolute; left: 0; top: 0; width: 880px; height: 900px; transform: scale(.65); transform-origin: 0 0">
          <sc-for list="{{edges}}" as="e" hint-placeholder-count="20">
            <svg aria-hidden="true" width="{{e.w}}" height="{{e.h}}" style="position: absolute; left: {{e.x}}px; top: {{e.y}}px; overflow: visible"><path d="{{e.d}}" fill="none" stroke="{{e.c}}" stroke-width="{{e.sw}}" stroke-dasharray="{{e.dash}}" opacity="{{e.op}}"></path></svg>
          </sc-for>
          <sc-for list="{{nodes}}" as="n" hint-placeholder-count="18">
            <button aria-pressed="{{n.sel}}" aria-label="{{n.aria}}" style="position: absolute; left: {{n.x}}px; top: {{n.y}}px; width: 180px; height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 10px; border: {{n.bw}} solid {{n.bd}}; background: var(--surface); color: var(--text); text-align: left">
              <span style="width: 28px; height: 28px; flex: none; border-radius: 7px; background: var(--surface-2); color: var(--muted); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="{{n.icon}}"></path></svg></span>
              <span style="flex: 1; min-width: 0">
                <span style="display: block; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.name}}</span>
                <span style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); white-space: nowrap"><span style="overflow: hidden; text-overflow: ellipsis">{{n.role}}</span><span style="display: inline-flex; align-items: center; gap: 3px; color: {{n.st.c}}; flex: none"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="{{n.st.d}}"></path></svg>{{n.st.t}}</span></span>
              </span>
            </button>
          </sc-for>
        </div>


        <div aria-label="Legend" style="position: absolute; right: 16px; bottom: 16px; display: flex; gap: 16px; padding: 8px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; color: var(--muted)">
          <sc-for list="{{legend}}" as="k" hint-placeholder-count="4">
            <span style="display: inline-flex; align-items: center; gap: 6px"><svg width="28" height="8" aria-hidden="true"><path d="M0 4H28" stroke="{{k.c}}" stroke-width="2" stroke-dasharray="{{k.dash}}"></path></svg>{{k.t}}</span>
          </sc-for>
        </div>
      </section>
      </div>

      <aside aria-label="Selected node" style="width: 360px; flex: none; border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; overflow: hidden">
        <div style="display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--border)">
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 16px; font-weight: 600">TV downloader</div>
            <div style="font-size: 12px; color: var(--muted)">Sonarr · container</div>
          </div>
          <button aria-label="Close panel" style="width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: var(--muted)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </div>
        <div style="flex: 1; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; align-items: center; gap: 8px">
            <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--surface-2); color: var(--warn); font-size: 13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 3l10 18H2zM12 10v4M12 17v.5"></path></svg>Warning</span>
            <span style="font-size: 12px; color: var(--muted)">TV library storage unreachable</span>
          </div>
          <div>
            <div style="font-size: 12px; color: var(--muted); letter-spacing: .04em; margin-bottom: 6px">RUNS ON</div>
            <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px">
              <sc-for list="{{chain}}" as="h" hint-placeholder-count="4">
                <span style="display: inline-flex; align-items: center; gap: 6px"><a href="#" style="min-height: 32px; display: inline-flex; align-items: center; text-decoration: none">{{h.n}}</a><span style="color: var(--muted)">{{h.sep}}</span></span>
              </sc-for>
            </div>
          </div>
          <div>
            <div style="font-size: 12px; color: var(--muted); letter-spacing: .04em; margin-bottom: 2px">CONNECTIONS</div>
            <sc-for list="{{conns}}" as="c" hint-placeholder-count="3">
              <div style="display: flex; align-items: center; gap: 8px; min-height: 48px; border-top: 1px solid var(--border)">
                <div style="flex: 1; min-width: 0"><div style="font-size: 13px">{{c.n}}</div><div style="font-size: 12px; color: var(--muted)">{{c.sub}}</div></div>
                <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: {{c.st.c}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="{{c.st.d}}"></path></svg>{{c.st.t}}</span>
                <sc-if value="{{c.fix}}" hint-placeholder-val="{{ false }}">
                  <button aria-label="Repair link to media player" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 600">Repair</button>
                </sc-if>
              </div>
            </sc-for>
          </div>
          <div>
            <div style="font-size: 12px; color: var(--muted); letter-spacing: .04em; margin-bottom: 2px">MOUNTS</div>
            <sc-for list="{{mounts}}" as="m" hint-placeholder-count="2">
              <div style="display: flex; align-items: center; gap: 8px; min-height: 48px; border-top: 1px solid var(--border)">
                <div style="flex: 1; min-width: 0"><div style="font-size: 13px">{{m.n}}</div><div style="font-size: 12px; color: var(--muted)">{{m.sub}}</div></div>
                <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: {{m.st.c}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="{{m.st.d}}"></path></svg>{{m.st.t}}</span>
              </div>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border)">
          <button style="flex: 1; height: 44px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text)">Open</button>
          <button style="flex: 1; height: 44px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text)">Restart</button>
          <button style="flex: 1; height: 44px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text)">Logs</button>
        </div>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const i = (n, b, c, cur) => ({n, b: b || '', c: c || 'var(--muted)', cur: cur ? 'page' : 'false', bg: cur ? 'var(--surface-2)' : 'transparent'});
const S = {
ok: {c: 'var(--ok)', d: 'M5 12l5 5L20 7', t: 'Healthy'},
warn: {c: 'var(--warn)', d: 'M12 3l10 18H2zM12 10v4M12 17v.5', t: 'Warning'},
fail: {c: 'var(--err)', d: 'M12 3a9 9 0 110 18a9 9 0 010-18zM12 8v5M12 16v.5', t: 'Failed'}
};
const I = {
mesh: 'M12 4a2 2 0 110 4a2 2 0 010-4zM5 16a2 2 0 110 4a2 2 0 010-4zM19 16a2 2 0 110 4a2 2 0 010-4zM12 8v4M12 12l-6 4M12 12l6 4',
system: 'M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01',
guest: 'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10',
container: 'M4 6h16v12H4zM8 6v12M12 6v12M16 6v12',
storage: 'M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3v12c0 1.7-3.6 3-8 3s-8-1.3-8-3zM4 6c0 1.7 3.6 3 8 3s8-1.3 8-3M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3'
};
const COL = [20, 230, 440, 650];
const Y = (r) => 20 + r * 68;
const defs = [
['home', 'home', 'Mesh · 9 systems', 0, 5, 'mesh', 'ok'],
['frigg', 'frigg', 'Proxmox host', 1, 2.75, 'system', 'ok'],
['thor', 'thor', 'Proxmox host', 1, 5, 'system', 'ok'],
['loki', 'loki', 'Gateway', 1, 6, 'system', 'ok'],
['mimir', 'mimir', 'Media host', 1, 7, 'system', 'ok'],
['njord', 'njord', 'Media host', 1, 8, 'system', 'ok'],
['willow', 'willow', 'Storage · Unraid', 1, 9, 'storage', 'fail'],
['maple', 'maple', 'Storage · Unraid', 1, 10, 'storage', 'ok'],
['hemlock', 'hemlock', 'Dev machine', 1, 11, 'system', 'ok'],
['mint', 'mint', 'Dev machine', 1, 12, 'system', 'ok'],
['baldur', 'baldur', 'LXC', 2, 1.5, 'guest', 'ok'],
['hass', 'Home Assistant', 'VM · hass', 2, 4, 'guest', 'ok'],
['freyr', 'freyr', 'LXC', 2, 5, 'guest', 'ok'],
['sonarr', 'TV downloader', 'Sonarr', 3, 0, 'container', 'warn'],
['radarr', 'Movie downloader', 'Radarr · expected', 3, 1, 'container', 'warn'],
['prowlarr', 'Indexer provider', 'Prowlarr', 3, 2, 'container', 'ok'],
['qbit', 'Download client', 'qBittorrent', 3, 3, 'container', 'ok'],
['hactl', 'Home control', 'Home Assistant', 3, 4, 'container', 'ok'],
['lazy', 'Book downloader', 'LazyLibrarian · expected', 3, 5, 'container', 'warn'],
['plex', 'Media player', 'Plex', 3, 7, 'container', 'ok'],
['jelly', 'Media player', 'Jellyfin', 3, 8, 'container', 'ok']
];
const P = {};
const nodes = defs.map(([id, name, role, col, r, kind, st]) => {
P[id] = {x: COL[col], cy: Y(r) + 28};
const sel = id === 'sonarr';
return {name, role, x: COL[col], y: Y(r), icon: I[kind], st: S[st], sel: sel ? 'true' : 'false', aria: name + ', ' + role + ', ' + S[st].t, bd: sel ? 'var(--accent)' : (st === 'fail' ? 'var(--err)' : 'var(--border)'), bw: sel ? '2px' : '1px'};
});
const box = (x, w, a, b, d, c, dash, sw, op) => {
const top = Math.min(a, b) - 4;
return {x, y: top, w, h: Math.abs(a - b) + 8, d: d(a - top, b - top), c, dash, sw, op: op || '1'};
};
const tree = (p, ch, mid, off, c, dash, sw) => {
const x1 = P[p].x + 180, x2 = P[ch].x, w = x2 - x1, o = off || 0;
return box(x1, w, P[p].cy + o, P[ch].cy + o, (a, b) => 'M0 ' + a + 'H' + mid + 'V' + b + 'H' + w, c || 'var(--border)', dash || 'none', sw || 1.5);
};
const right = (a, b, bend, c, dash) => box(830, 50, P[a].cy, P[b].cy, (ya, yb) => 'M0 ' + ya + 'H' + bend + 'V' + yb + 'H0', c, dash, 1.5);
const parents = [['home','frigg'],['home','thor'],['home','loki'],['home','mimir'],['home','njord'],['home','willow'],['home','maple'],['home','hemlock'],['home','mint'],['hass','hactl'],['frigg','baldur'],['frigg','hass'],['thor','freyr'],['baldur','sonarr'],['baldur','radarr'],['baldur','prowlarr'],['baldur','qbit'],['freyr','lazy']];
parents.push(['mimir', 'plex'], ['njord', 'jelly']);
const edges = parents.map(([p, c]) => tree(p, c, 15));
edges.push(box(206, 24, P.willow.cy, P.frigg.cy, (a, b) => 'M24 ' + a + 'H4V' + b + 'H24', 'var(--info)', '5 4', 1.5));
edges.push(box(206, 24, P.maple.cy, P.willow.cy, (a, b) => 'M24 ' + a + 'H4V' + b, 'var(--info)', '5 4', 1.5));
edges.push(tree('frigg', 'baldur', 22, 10, 'var(--info)', '5 4', 1.5));
edges.push(tree('baldur', 'sonarr', 22, 10, 'var(--info)', '5 4', 1.5));
edges.push(right('sonarr', 'prowlarr', 14, 'var(--accent)', '2 4'));
edges.push(right('sonarr', 'qbit', 26, 'var(--accent)', '2 4'));
edges.push(right('sonarr', 'plex', 40, 'var(--err)', '2 4'));
const chainNames = ['home', 'frigg', 'baldur', 'sonarr'];
return {
groups: [
{name: 'DASHBOARDS', items: [i('Home control'), i('Media')]},
{name: 'MANAGE', items: [i('Topology', '', '', true), i('Inventory'), i('Plugins', '2 updates', 'var(--info)'), i('Backups', '2 gaps', 'var(--warn)'), i('Jobs'), i('People')]},
{name: 'SHARED', items: [i('Family')]}
],
nodes,
edges,
legend: [
{t: 'Runs on', c: 'var(--muted)', dash: 'none'},
{t: 'Storage passthrough', c: 'var(--info)', dash: '5 4'},
{t: 'Service connection', c: 'var(--accent)', dash: '2 4'},
{t: 'Broken', c: 'var(--err)', dash: '2 4'}
],
chain: chainNames.map((n, k) => ({n, sep: k < chainNames.length - 1 ? '›' : ''})),
conns: [
{n: 'Media player · Plex', sub: 'Scan TV library after import', st: S.fail, fix: true},
{n: 'Indexer provider · Prowlarr', sub: 'Search indexers', st: S.ok, fix: false},
{n: 'Download client · qBittorrent', sub: 'Send downloads', st: S.ok, fix: false}
],
mounts: [
{n: 'TV library', sub: 'willow share › frigg › baldur', st: S.fail},
{n: 'Downloads', sub: 'maple share › frigg › baldur', st: S.ok}
]
};
}
}
</script>
</body>
</html>
