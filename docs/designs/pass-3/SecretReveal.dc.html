<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Secret reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--bg:#0F1115;--surface:#171A21;--surface-2:#1E222B;--border:#262A33;--text:#E6E8EC;--muted:#9BA1AD;--accent:#7C8CFF;--on-accent:#0F1115;--ok:#3FB68B;--warn:#E0A340;--err:#E5636B;--info:#6FA8FF}
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 14px; overflow: hidden; position: relative">
  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--border)">
    <h1 style="flex: 1; margin: 0; font-size: 17px; font-weight: 600">{{app.name}} password</h1>
    <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: var(--text)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </header>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 6px 6px 6px 14px">
        <div style="flex: 1; min-width: 0"><div style="font-weight: 500">{{app.name}}</div>
          <div style="font-size: 12px; color: var(--muted)">{{app.user}} · <sc-if value="{{isRevealed}}" hint-placeholder-val="{{ false }}"><code style="font-family: ui-monospace, monospace; font-size: 13px; color: var(--text)">{{secret}}</code></sc-if><sc-if value="{{isHidden}}" hint-placeholder-val="{{ true }}"><span style="letter-spacing: 2px">••••••••</span></sc-if> · changed {{app.changed}}</div>
        </div>
        <button aria-label="{{app.copy}}" style="width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: var(--text)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a1 1 0 011-1h9"></path></svg></button>
        <button aria-label="{{app.rotate}}" style="width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: var(--text)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 12a8 8 0 11-2.3-5.7"></path><path d="M20 4v5h-5"></path></svg></button>
      </div>
    </div>
    <sc-if value="{{isRevealed}}" hint-placeholder-val="{{ false }}">
      <div role="status" style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Hides in {{countdown}}s</div>
    </sc-if>
    <div style="font-size: 12px; color: var(--muted)">Rotate makes a new password and signs out other sessions in this app.</div>
  </div>

  <sc-if value="{{isHidden}}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--bg); opacity: .7"></div>
    <div role="dialog" aria-modal="true" aria-labelledby="su-t" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 8px 16px 24px">
      <div style="display: flex; align-items: center">
        <h2 id="su-t" style="flex: 1; margin: 0; font-size: 17px; font-weight: 600">Confirm it's you</h2>
        <button style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: var(--accent)">Cancel</button>
      </div>
      <p style="margin: 4px 0 12px; color: var(--muted)">{{prompt}}</p>
      <label for="su-in" style="display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px">{{fieldLabel}}</label>
      <sc-if value="{{isTotp}}" hint-placeholder-val="{{ true }}">
        <input id="su-in" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" value="{{entered}}" aria-invalid="{{isError}}" aria-describedby="su-err" style="width: 100%; box-sizing: border-box; height: 52px; background: var(--bg); border: 1px solid {{fieldBorder}}; border-radius: 8px; color: var(--text); font-family: ui-monospace, monospace; font-size: 22px; letter-spacing: 8px; text-align: center">
      </sc-if>
      <sc-if value="{{isPassword}}" hint-placeholder-val="{{ false }}">
        <input id="su-in" type="password" autocomplete="current-password" value="{{entered}}" aria-invalid="{{isError}}" aria-describedby="su-err" style="width: 100%; box-sizing: border-box; height: 52px; background: var(--bg); border: 1px solid {{fieldBorder}}; border-radius: 8px; color: var(--text); font: inherit; padding: 0 12px">
      </sc-if>
      <sc-if value="{{isError}}" hint-placeholder-val="{{ false }}">
        <div id="su-err" role="alert" style="display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; color: var(--err)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>{{errorText}}</div>
      </sc-if>
      <button style="width: 100%; height: 48px; margin-top: 16px; border-radius: 10px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600">{{confirm}}</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"factor":{"editor":"enum","default":"totp","options":["totp","password"]},"state":{"editor":"enum","default":"prompt","options":["prompt","error","revealed"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const factor = this.props.factor ?? 'totp';
const state = this.props.state ?? 'prompt';
const isTotp = factor === 'totp';
const isError = state === 'error';
return {
app: {name: 'Plex', user: 'scott', changed: '3 months ago', copy: 'Copy Plex password', rotate: 'Rotate Plex password'},
secret: 'k7Qm-29vX-pL4t',
countdown: '60',
isRevealed: state === 'revealed',
isHidden: state !== 'revealed',
isTotp: isTotp,
isPassword: !isTotp,
isError: isError,
entered: isError ? (isTotp ? '481920' : 'password') : '',
fieldBorder: isError ? 'var(--err)' : 'var(--border)',
fieldLabel: isTotp ? 'Authenticator code' : 'Password',
prompt: isTotp ? 'Enter the 6-digit code from your authenticator app to view the Plex password.' : 'Re-enter your orca password to view the Plex password.',
errorText: isTotp ? 'That code didn’t match. Try the newest code.' : 'Wrong password. Try again.',
confirm: 'Verify and show'
};
}
}
</script>
</body>
</html>
