<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inventory</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--bg:#0F1115;--surface:#171A21;--surface-2:#1E222B;--border:#262A33;--text:#E6E8EC;--muted:#9BA1AD;--accent:#7C8CFF;--on-accent:#0F1115;--ok:#3FB68B;--warn:#E0A340;--err:#E5636B;--info:#6FA8FF}
body{margin:0}
a{color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
</style>
</helmet>
<div style="width: 1280px; height: 860px; display: flex; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 14px; overflow: hidden">
  <nav aria-label="Main" style="width: 248px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 12px; gap: 2px; box-sizing: border-box">
    <button aria-label="Switch mesh" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 10px; margin-bottom: 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; text-align: left">
      <span style="width: 24px; height: 24px; border-radius: 6px; background: var(--accent); flex: none"></span>
      <span style="flex: 1"><span style="display: block; font-weight: 600">home</span><span style="display: block; font-size: 12px; color: var(--muted)">9 systems · 1 down</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div>
        <div style="font-size: 12px; color: var(--muted); padding: 10px 12px 4px; letter-spacing: .04em">{{g.name}}</div>
        <sc-for list="{{g.items}}" as="i" hint-placeholder-count="4">
          <a href="#" aria-current="{{i.cur}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 40px; padding: 0 12px; border-radius: 8px; background: {{i.bg}}; color: var(--text); text-decoration: none"><span>{{i.n}}</span><span style="font-size: 12px; color: {{i.c}}">{{i.b}}</span></a>
        </sc-for>
      </div>
    </sc-for>
    <div style="flex: 1"></div>
    <sc-for list="{{footer}}" as="i" hint-placeholder-count="2">
      <a href="#" aria-current="{{i.cur}}" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 8px; background: {{i.bg}}; color: var(--text); text-decoration: none">{{i.n}}</a>
    </sc-for>
    <button aria-label="Collapse sidebar" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); font: inherit; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path><path d="M15 10l-2 2 2 2"></path></svg>
      <span>Collapse</span>
    </button>
  </nav>
  <main style="flex: 1; display: flex; flex-direction: column; min-width: 0">
    <header style="height: 64px; flex: none; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 24px">
      <label for="q" style="flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; max-width: 680px; box-sizing: border-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="q" placeholder="Search or run a command" aria-label="Search or run a command" style="flex: 1; background: transparent; border: 0; color: var(--text); font: inherit; outline: none">
        <span style="font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px">Ctrl K</span>
      </label>
      <div style="flex: 1"></div>
      <button aria-label="Notifications, 3 unread" style="width: 44px; height: 44px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--text); position: relative">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 004 0"></path></svg>
        <span style="position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--err); color: var(--on-accent); font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 4px; box-sizing: border-box">3</span>
      </button>
      <button aria-label="Account menu" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; font-size: 13px; font-weight: 600">SK</button>
    </header>
    <section style="padding: 20px 32px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; flex: 1">
      <div style="display: flex; align-items: center; gap: 12px">
        <h1 style="margin: 0; font-size: 20px; font-weight: 600; flex: 1">Inventory</h1>
        <span style="font-size: 13px; color: var(--muted)">{{total}}</span>
        <button style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 0; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600">Deploy</button>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <div role="toolbar" aria-label="Filter by kind" style="display: flex; gap: 6px">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
            <button aria-pressed="{{f.on}}" style="min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{f.bd}}; background: {{f.bg}}; color: {{f.fg}}; font: inherit; font-size: 13px">{{f.n}} <span style="opacity: .7">{{f.count}}</span></button>
          </sc-for>
        </div>
        <div style="flex: 1"></div>
        <label for="groupby" style="font-size: 13px; color: var(--muted)">Group by</label>
        <select id="groupby" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 13px">
          <option>System</option>
          <option>Kind</option>
          <option>Status</option>
          <option>None</option>
        </select>
      </div>
      <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden">
        <div style="display: grid; grid-template-columns: 1.8fr 0.8fr 0.8fr 80px 90px 150px 52px; align-items: center; padding: 0 8px 0 16px; height: 36px; font-size: 12px; color: var(--muted); letter-spacing: .04em; border-bottom: 1px solid var(--border)">
          <span>NAME</span><span>HOST</span><span>RUNTIME</span><span>CPU</span><span>MEMORY</span><span>STATUS</span><span></span>
        </div>
        <sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
          <div>
            <div style="display: flex; align-items: center; gap: 8px; padding: 0 16px; height: 30px; background: var(--surface-2); font-size: 12px; color: var(--muted)">
              <span style="color: var(--text); font-weight: 500">{{s.name}}</span><span>{{s.sub}}</span>
            </div>
            <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="4">
              <div style="display: grid; grid-template-columns: 1.8fr 0.8fr 0.8fr 80px 90px 150px 52px; align-items: center; padding: 0 8px 0 16px; min-height: 44px; border-top: 1px solid var(--border)">
                <a href="#" style="display: flex; align-items: center; gap: 10px; min-height: 44px; color: var(--text); text-decoration: none; min-width: 0">
                  <span role="img" aria-label="{{r.kind}}" style="width: 28px; height: 28px; border-radius: 6px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--muted); flex: none">
                    <sc-if value="{{r.isSys}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="1.5"></rect><rect x="3" y="13" width="18" height="7" rx="1.5"></rect><path d="M7 7.5h.01M7 16.5h.01"></path></svg></sc-if>
                    <sc-if value="{{r.isVm}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg></sc-if>
                    <sc-if value="{{r.isLxc}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"></path></svg></sc-if>
                    <sc-if value="{{r.isCt}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="7" width="18" height="12" rx="1"></rect><path d="M7 7v12M11 7v12M15 7v12M19 7v12"></path></svg></sc-if>
                    <sc-if value="{{r.isSvc}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg></sc-if>
                  </span>
                  <span style="min-width: 0"><span style="display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</span><span style="display: block; font-size: 12px; color: var(--muted)">{{r.kind}}</span></span>
                </a>
                <span style="font-size: 13px; color: var(--muted)">{{r.host}}</span>
                <span style="font-size: 13px; color: var(--muted)">{{r.runtime}}</span>
                <span style="font-size: 13px">{{r.cpu}}</span>
                <span style="font-size: 13px">{{r.mem}}</span>
                <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px">
                  <span style="display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; background: var(--surface-2); color: {{r.sb.color}}; font-size: 12px; font-weight: 500">
                    <sc-if value="{{r.sb.ok}}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12l3 3 5-6"></path></svg></sc-if>
                    <sc-if value="{{r.sb.warn}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v4M12 17v.5"></path></svg></sc-if>
                    <sc-if value="{{r.sb.err}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9 9l6 6M15 9l-6 6"></path></svg></sc-if>
                    <sc-if value="{{r.sb.idle}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9 12h6"></path></svg></sc-if>
                    {{r.sb.label}}
                  </span>
                  <sc-if value="{{r.sb.hasSub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; color: var(--muted)">{{r.sb.sub}}</span></sc-if>
                </span>
                <span style="display: flex; justify-content: flex-end">
                  <button aria-label="{{r.moreLabel}}" style="width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: var(--muted)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
                  </button>
                </span>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const i = (n, cur, b, c) => ({n, b: b || '', c: c || 'var(--muted)', cur: cur ? 'page' : 'false', bg: cur ? 'var(--surface-2)' : 'transparent'});
const SB = {Healthy: 'var(--ok)', Warning: 'var(--warn)', Failed: 'var(--err)', Info: 'var(--info)', Idle: 'var(--muted)', Planned: 'var(--muted)'};
const sb = (label, sub) => ({label, sub: sub || '', hasSub: !!sub, color: SB[label], ok: label === 'Healthy', warn: label === 'Warning', err: label === 'Failed', info: label === 'Info', idle: label === 'Idle', plan: label === 'Planned'});
const chip = (n, count, on) => ({n, count, on: on ? 'true' : 'false', bg: on ? 'var(--accent)' : 'var(--surface)', fg: on ? 'var(--on-accent)' : 'var(--text)', bd: on ? 'var(--accent)' : 'var(--border)'});
const row = (name, kind, host, runtime, status, sub, cpu, mem) => ({
name, kind, host, runtime, cpu, mem, sb: sb(status, sub),
isSys: kind === 'System', isVm: kind === 'VM', isLxc: kind === 'LXC', isCt: kind === 'Container', isSvc: kind === 'Service',
moreLabel: 'More actions for ' + name
});
return {
groups: [
{name: 'DASHBOARDS', items: [i('Home control'), i('Media')]},
{name: 'MANAGE', items: [i('Topology'), i('Inventory', true), i('Plugins', false, '2 updates', 'var(--info)'), i('Backups', false, '2 gaps', 'var(--warn)'), i('Jobs'), i('People')]},
{name: 'SHARED', items: [i('Family')]}
],
footer: [i('Account'), i('Settings')],
total: '12 items · 1 warning',
filters: [chip('All', '12', true), chip('System', '3'), chip('VM', '1'), chip('LXC', '3'), chip('Container', '1'), chip('Service', '4')],
sections: [
{name: 'frigg', sub: '· 5 items', rows: [
row('frigg', 'System', '—', 'Proxmox VE', 'Healthy', '', '18%', '38 GB'),
row('baldur', 'LXC', 'frigg', 'Proxmox', 'Healthy', '', '14%', '3.1 GB'),
row('TV downloader · Sonarr', 'Service', 'baldur', 'Docker', 'Healthy', '', '3%', '412 MB'),
row('Download client · qBittorrent', 'Service', 'baldur', 'Docker', 'Warning', 'high memory', '38%', '1.2 GB'),
row('Home Assistant', 'VM', 'frigg', 'Proxmox', 'Healthy', '', '6%', '2.0 GB')
]},
{name: 'thor', sub: '· 4 items', rows: [
row('thor', 'System', '—', 'Proxmox VE', 'Healthy', '', '11%', '22 GB'),
row('freyr', 'LXC', 'thor', 'Proxmox', 'Healthy', '', '9%', '2.4 GB'),
row('Audiobook server · Audiobookshelf', 'Service', 'freyr', 'Podman', 'Healthy', '', '1%', '210 MB'),
row('Music player · Navidrome', 'Service', 'freyr', 'Podman', 'Idle', '', '0%', '0 MB')
]},
{name: 'loki', sub: '· 3 items', rows: [
row('loki', 'System', '—', 'Debian', 'Healthy', '', '4%', '1.1 GB'),
row('DNS filter · AdGuard', 'LXC', 'loki', 'Proxmox', 'Healthy', '', '2%', '160 MB'),
row('caddy', 'Container', 'loki', 'Docker', 'Healthy', '', '1%', '48 MB')
]}
]
};
}
}
</script>
</body>
</html>
