<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Topology</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--bg:#0F1115;--surface:#171A21;--surface-2:#1E222B;--border:#262A33;--text:#E6E8EC;--muted:#9BA1AD;--accent:#7C8CFF;--on-accent:#0F1115;--ok:#3FB68B;--warn:#E0A340;--err:#E5636B;--info:#6FA8FF}
body{margin:0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 14px; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); flex: none">
    <button aria-label="Open menu" style="width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
    <label for="q" style="flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; box-sizing: border-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" placeholder="Search or run a command" aria-label="Search or run a command" style="flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text); font: inherit; outline: none">
    </label>
    <button aria-label="Notifications, 3 unread" style="width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: var(--text); position: relative; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 004 0"></path></svg>
      <span style="position: absolute; top: 6px; right: 4px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--err); color: var(--on-accent); font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 4px; box-sizing: border-box">3</span>
    </button>
    <button aria-label="Account" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--text); font-size: 13px; font-weight: 600">SK</button>
  </header>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 4px; flex: none">
    <h1 style="margin: 0; font-size: 20px; font-weight: 600">Topology</h1>
    <div role="tablist" aria-label="View" style="display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 2px">
      <button role="tab" aria-selected="true" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: var(--surface-2); color: var(--text)">Tree</button>
      <button role="tab" aria-selected="false" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: transparent; color: var(--muted)">Graph</button>
    </div>
  </div>

  <div role="alert" style="margin: 4px 16px 4px; padding: 6px 6px 6px 12px; background: var(--surface); border: 1px solid var(--err); border-radius: 10px; display: flex; align-items: center; gap: 10px; flex: none">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--err)" stroke-width="2.5" aria-hidden="true"><path d="M12 3a9 9 0 110 18a9 9 0 010-18zM12 8v5M12 16v.5"></path></svg>
    <div style="flex: 1; min-width: 0; font-size: 13px"><span style="font-weight: 600">willow is down</span><span style="color: var(--muted)"> · 2 dependents expected down</span></div>
    <button style="height: 44px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600">Review fix</button>
  </div>

  <div role="tree" aria-label="Mesh topology" style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 0 12px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
      <div role="treeitem" aria-level="{{r.level}}" aria-expanded="{{r.exp}}" aria-selected="{{r.sel}}" style="display: flex; align-items: center; height: 44px; border-radius: 8px; background: {{r.bg}}">
        <sc-for list="{{r.guides}}" as="g" hint-placeholder-count="2">
          <span aria-hidden="true" style="position: relative; width: 22px; height: 44px; flex: none">
            <span style="position: absolute; left: 21px; top: 0; width: 1px; height: {{g.up}}px; background: var(--border)"></span>
            <span style="position: absolute; left: 21px; top: 22px; width: 1px; height: {{g.down}}px; background: var(--border)"></span>
            <span style="position: absolute; left: 21px; top: 22px; width: {{g.stub}}px; height: 1px; background: var(--border)"></span>
          </span>
        </sc-for>
        <sc-if value="{{r.hasKids}}" hint-placeholder-val="{{ true }}">
          <button aria-label="{{r.toggleLabel}}" style="width: 44px; height: 44px; flex: none; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="{{r.chev}}"></path></svg>
          </button>
        </sc-if>
        <sc-if value="{{r.leaf}}" hint-placeholder-val="{{ false }}">
          <span style="width: 14px; flex: none"></span>
        </sc-if>
        <button style="flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; color: var(--text); text-align: left; padding: 0 8px 0 0">
          <span style="width: 26px; height: 26px; flex: none; border-radius: 7px; background: var(--surface-2); color: var(--muted); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
          <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.role}}</span></span>
          <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: {{r.st.c}}; flex: none"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="{{r.st.d}}"></path></svg>{{r.st.t}}</span>
        </button>
      </div>
    </sc-for>
  </div>

  <section aria-label="TV downloader details" style="flex: none; height: 372px; background: var(--surface); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; display: flex; flex-direction: column">
    <div aria-hidden="true" style="width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 8px auto 0; flex: none"></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; flex: none">
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 16px; font-weight: 600">TV downloader</div>
        <div style="font-size: 12px; color: var(--muted)">Sonarr · container</div>
      </div>
      <button aria-label="Close details" style="width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: var(--muted)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 8px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--surface-2); color: var(--warn); font-size: 13px; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 3l10 18H2zM12 10v4M12 17v.5"></path></svg>Warning</span>
        <span style="font-size: 12px; color: var(--muted)">TV library storage unreachable</span>
      </div>
      <div>
        <div style="font-size: 12px; color: var(--muted); letter-spacing: .04em; margin-bottom: 4px">RUNS ON</div>
        <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px">
          <sc-for list="{{chain}}" as="h" hint-placeholder-count="4">
            <span style="display: inline-flex; align-items: center; gap: 6px"><a href="#" style="min-height: 32px; display: inline-flex; align-items: center; text-decoration: none">{{h.n}}</a><span style="color: var(--muted)">{{h.sep}}</span></span>
          </sc-for>
        </div>
      </div>
      <div>
        <div style="font-size: 12px; color: var(--muted); letter-spacing: .04em; margin-bottom: 2px">CONNECTIONS</div>
        <sc-for list="{{conns}}" as="c" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 8px; min-height: 48px; border-top: 1px solid var(--border)">
            <div style="flex: 1; min-width: 0"><div style="font-size: 13px">{{c.n}}</div><div style="font-size: 12px; color: var(--muted)">{{c.sub}}</div></div>
            <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: {{c.st.c}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="{{c.st.d}}"></path></svg>{{c.st.t}}</span>
            <sc-if value="{{c.fix}}" hint-placeholder-val="{{ false }}">
              <button aria-label="Repair link to media player" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 600">Repair</button>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <div>
        <div style="font-size: 12px; color: var(--muted); letter-spacing: .04em; margin-bottom: 2px">MOUNTS</div>
        <sc-for list="{{mounts}}" as="m" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 8px; min-height: 48px; border-top: 1px solid var(--border)">
            <div style="flex: 1; min-width: 0"><div style="font-size: 13px">{{m.n}}</div><div style="font-size: 12px; color: var(--muted)">{{m.sub}}</div></div>
            <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: {{m.st.c}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="{{m.st.d}}"></path></svg>{{m.st.t}}</span>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; gap: 8px; padding: 8px 16px 16px; border-top: 1px solid var(--border); flex: none">
      <button style="flex: 1; height: 44px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text)">Open</button>
      <button style="flex: 1; height: 44px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text)">Restart</button>
      <button style="flex: 1; height: 44px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text)">Logs</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const S = {
ok: {c: 'var(--ok)', d: 'M5 12l5 5L20 7', t: 'Healthy'},
warn: {c: 'var(--warn)', d: 'M12 3l10 18H2zM12 10v4M12 17v.5', t: 'Warning'},
fail: {c: 'var(--err)', d: 'M12 3a9 9 0 110 18a9 9 0 010-18zM12 8v5M12 16v.5', t: 'Failed'}
};
const I = {
mesh: 'M12 4a2 2 0 110 4a2 2 0 010-4zM5 16a2 2 0 110 4a2 2 0 010-4zM19 16a2 2 0 110 4a2 2 0 010-4zM12 8v4M12 12l-6 4M12 12l6 4',
system: 'M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01',
guest: 'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10',
container: 'M4 6h16v12H4zM8 6v12M12 6v12M16 6v12',
storage: 'M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3v12c0 1.7-3.6 3-8 3s-8-1.3-8-3zM4 6c0 1.7 3.6 3 8 3s8-1.3 8-3M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3'
};
const n = (name, role, kind, st, kids, open, sel) => ({name, role, kind, st, kids: kids || [], open: !!open, sel: !!sel});
const tree = n('home', 'Mesh · 9 systems', 'mesh', 'ok', [
n('frigg', 'Proxmox host', 'system', 'ok', [
n('baldur', 'LXC', 'guest', 'ok', [
n('TV downloader', 'Sonarr', 'container', 'warn', [], false, true),
n('Movie downloader', 'Radarr · expected', 'container', 'warn'),
n('Indexer provider', 'Prowlarr', 'container', 'ok'),
n('Download client', 'qBittorrent', 'container', 'ok')
], true),
n('Home Assistant', 'VM', 'guest', 'ok', [n('Home control', 'Home Assistant', 'container', 'ok')])
], true),
n('thor', 'Proxmox host', 'system', 'ok', [
n('freyr', 'LXC', 'guest', 'ok', [n('Book downloader', 'LazyLibrarian · expected', 'container', 'warn')])
]),
n('loki', 'Gateway', 'system', 'ok'),
n('mimir', 'Media host', 'system', 'ok', [n('Media player', 'Plex', 'container', 'ok')]),
n('njord', 'Media host', 'system', 'ok', [n('Media player', 'Jellyfin', 'container', 'ok')]),
n('willow', 'Storage · Unraid', 'storage', 'fail'),
n('maple', 'Storage · Unraid', 'storage', 'ok'),
n('hemlock', 'Dev machine', 'system', 'ok'),
n('mint', 'Dev machine', 'system', 'ok')
], true);
const rows = [];
const walk = (node, depth, lastFlags) => {
const hasKids = node.kids.length > 0;
const guides = lastFlags.map((last, k) => {
const own = k === lastFlags.length - 1;
if (!own) return {up: last ? 0 : 44, down: 0, stub: 0};
return {up: 22, down: last ? 0 : 22, stub: hasKids ? 14 : 18};
});
rows.push({
name: node.name, role: node.role, icon: I[node.kind], st: S[node.st], guides,
level: String(depth + 1), hasKids, leaf: !hasKids,
exp: hasKids ? String(node.open) : 'false',
toggleLabel: (node.open ? 'Collapse ' : 'Expand ') + node.name,
chev: node.open ? 'M6 9l6 6 6-6' : 'M9 6l6 6-6 6',
sel: node.sel ? 'true' : 'false',
bg: node.sel ? 'var(--surface-2)' : 'transparent'
});
if (node.open) node.kids.forEach((c, k) => walk(c, depth + 1, lastFlags.concat([k === node.kids.length - 1])));
};
walk(tree, 0, []);
const chainNames = ['home', 'frigg', 'baldur', 'sonarr'];
return {
rows,
chain: chainNames.map((c, k) => ({n: c, sep: k < chainNames.length - 1 ? '›' : ''})),
conns: [
{n: 'Media player · Plex', sub: 'Scan TV library after import', st: S.fail, fix: true},
{n: 'Indexer provider · Prowlarr', sub: 'Search indexers', st: S.ok, fix: false},
{n: 'Download client · qBittorrent', sub: 'Send downloads', st: S.ok, fix: false}
],
mounts: [
{n: 'TV library', sub: 'willow share › frigg › baldur', st: S.fail},
{n: 'Downloads', sub: 'maple share › frigg › baldur', st: S.ok}
]
};
}
}
</script>
</body>
</html>
