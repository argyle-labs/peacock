<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peacock backups</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--bg:#0F1115;--surface:#171A21;--surface-2:#1E222B;--border:#262A33;--text:#E6E8EC;--muted:#9BA1AD;--accent:#7C8CFF;--on-accent:#0F1115;--ok:#3FB68B;--warn:#E0A340;--err:#E5636B;--info:#6FA8FF}
body{margin:0}
a{color:var(--accent)}
</style>
</helmet>
<div style="width: 1280px; height: 860px; display: flex; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 14px; overflow: hidden">
  <nav aria-label="Main" style="width: 248px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 12px; gap: 2px; box-sizing: border-box">
    <button aria-label="Switch mesh" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 10px; margin-bottom: 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; text-align: left">
      <span style="width: 24px; height: 24px; border-radius: 6px; background: var(--accent); flex: none"></span>
      <span style="flex: 1"><span style="display: block; font-weight: 600">home</span><span style="display: block; font-size: 12px; color: var(--muted)">9 systems · 1 down</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div>
        <div style="font-size: 12px; color: var(--muted); padding: 10px 12px 4px; letter-spacing: .04em">{{g.name}}</div>
        <sc-for list="{{g.items}}" as="i" hint-placeholder-count="4">
          <a href="#" aria-current="{{i.cur}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 40px; padding: 0 12px; border-radius: 8px; background: {{i.bg}}; color: var(--text); text-decoration: none"><span>{{i.n}}</span><span style="font-size: 12px; color: {{i.c}}">{{i.b}}</span></a>
        </sc-for>
      </div>
    </sc-for>
    <div style="flex: 1"></div>
    <sc-for list="{{footer}}" as="i" hint-placeholder-count="2">
      <a href="#" aria-current="{{i.cur}}" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 8px; background: {{i.bg}}; color: var(--text); text-decoration: none">{{i.n}}</a>
    </sc-for>
    <button aria-label="Collapse sidebar" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); font: inherit; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path><path d="M15 10l-2 2 2 2"></path></svg>
      <span>Collapse</span>
    </button>
  </nav>
  <main style="flex: 1; display: flex; flex-direction: column; min-width: 0">
    <header style="height: 64px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 24px; flex: none">
      <label for="q" style="flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; max-width: 680px; box-sizing: border-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="q" placeholder="Search or run a command" aria-label="Search or run a command" style="flex: 1; background: transparent; border: 0; color: var(--text); font: inherit; outline: none">
        <span style="font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px">Ctrl K</span>
      </label>
      <div style="flex: 1"></div>
      <button aria-label="Notifications, 3 unread" style="width: 44px; height: 44px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--text); position: relative">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 004 0"></path></svg>
        <span style="position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--err); color: var(--on-accent); font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 4px; box-sizing: border-box">3</span>
      </button>
      <button aria-label="Account menu" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; font-size: 13px; font-weight: 600">SK</button>
    </header>
    <div style="flex: 1; display: flex; min-height: 0; position: relative">
      <section style="flex: 1; min-width: 0; padding: 20px 32px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
        <div style="display: flex; align-items: center; gap: 12px">
          <h1 style="margin: 0; font-size: 20px; font-weight: 600; flex: 1">Backups</h1>
          <span style="font-size: 13px; color: var(--muted)">7 items · 2 gaps</span>
          <button style="min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); font: inherit; font-size: 13px">Verify all</button>
          <button style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 0; background: var(--accent); color: var(--on-accent); font: inherit; font-size: 13px; font-weight: 600">Restore or migrate</button>
        </div>
        <div role="tablist" aria-label="Backup sections" style="display: flex; gap: 4px; border-bottom: 1px solid var(--border)">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
            <button role="tab" aria-selected="{{t.sel}}" style="min-height: 44px; padding: 0 14px; border: 0; border-bottom: 2px solid {{t.bd}}; background: transparent; color: {{t.fg}}; font: inherit; font-size: 13px">{{t.n}} <span style="opacity: .7">{{t.count}}</span></button>
          </sc-for>
        </div>
        <div role="tabpanel" aria-label="Coverage" style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden">
          <div style="display: grid; grid-template-columns: 1.6fr 1fr 1.3fr 130px 160px; align-items: center; padding: 0 8px 0 16px; height: 36px; font-size: 12px; color: var(--muted); letter-spacing: .04em; border-bottom: 1px solid var(--border)">
            <span>ITEM</span><span>SCHEDULE</span><span>LAST VERIFIED</span><span>STATUS</span><span></span>
          </div>
          <sc-for list="{{coverage}}" as="c" hint-placeholder-count="7">
            <div style="display: grid; grid-template-columns: 1.6fr 1fr 1.3fr 130px 160px; align-items: center; padding: 0 8px 0 16px; min-height: 52px; border-top: 1px solid var(--border)">
              <span style="min-width: 0"><span style="display: block">{{c.name}}</span><span style="display: block; font-size: 12px; color: var(--muted)">{{c.sub}}</span></span>
              <span style="font-size: 13px; color: var(--muted)">{{c.sched}}</span>
              <span style="font-size: 13px; color: var(--muted)">{{c.verified}}</span>
              <span style="display: inline-flex; justify-self: start; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; background: var(--surface-2); color: {{c.sb.color}}; font-size: 12px; font-weight: 500">
                <sc-if value="{{c.sb.ok}}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12l3 3 5-6"></path></svg></sc-if>
                <sc-if value="{{c.sb.warn}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v4M12 17v.5"></path></svg></sc-if>
                <sc-if value="{{c.sb.err}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9 9l6 6M15 9l-6 6"></path></svg></sc-if>
                {{c.sb.label}}
              </span>
              <span style="display: flex; justify-content: flex-end; align-items: center; gap: 4px">
                <sc-if value="{{c.gap}}" hint-placeholder-val="{{ false }}"><button style="min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); font: inherit; font-size: 13px">Add to schedule</button></sc-if>
                <button aria-label="{{c.moreLabel}}" style="width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: var(--muted)">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
                </button>
              </span>
            </div>
          </sc-for>
        </div>
      </section>
      <div style="position: absolute; inset: 0; background: rgba(15,17,21,.72); display: flex; align-items: center; justify-content: center">
        <div role="dialog" aria-modal="true" aria-labelledby="wz-title" style="width: 640px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; align-items: center; gap: 8px">
            <div style="flex: 1"><div style="font-size: 12px; color: var(--muted)">Step 2 of 4 · Media player · Plex</div><h2 id="wz-title" style="margin: 2px 0 0; font-size: 17px; font-weight: 600">Choose target</h2></div>
            <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: var(--muted)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </div>
          <ol aria-label="Steps" style="display: flex; gap: 6px; margin: 0; padding: 0; list-style: none">
            <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
              <li style="flex: 1; font-size: 12px; color: {{s.fg}}; border-top: 3px solid {{s.bd}}; padding-top: 6px">{{s.n}}</li>
            </sc-for>
          </ol>
          <div style="font-size: 13px; color: var(--muted)">Restoring backup from today 03:00 · verified</div>
          <fieldset style="border: 0; margin: 0; padding: 0; display: flex; gap: 8px">
            <legend style="font-size: 12px; color: var(--muted); letter-spacing: .04em; margin-bottom: 6px">WHERE</legend>
            <label style="flex: 1; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border)"><input type="radio" name="where" aria-label="Same place"><span><span style="display: block">Same place</span><span style="display: block; font-size: 12px; color: var(--muted)">Docker on mimir, replaces current</span></span></label>
            <label style="flex: 1; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--accent)"><input type="radio" name="where" checked="checked" aria-label="Migrate"><span><span style="display: block">Migrate</span><span style="display: block; font-size: 12px; color: var(--muted)">Another system or runtime</span></span></label>
          </fieldset>
          <div style="display: flex; gap: 12px; align-items: center">
            <label for="tsys" style="font-size: 13px; color: var(--muted); width: 64px">System</label>
            <select id="tsys" style="flex: 1; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; padding: 0 10px"><option>njord · media host</option><option>thor · Proxmox host</option><option>frigg · Proxmox host</option><option>mint · Mac</option></select>
          </div>
          <div style="font-size: 12px; color: var(--muted); letter-spacing: .04em">RUNTIME</div>
          <div role="radiogroup" aria-label="Runtime" style="display: flex; flex-direction: column; gap: 4px">
            <sc-for list="{{runtimes}}" as="r" hint-placeholder-count="5">
              <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid {{r.bd}}; color: {{r.fg}}">
                <sc-if value="{{r.on}}" hint-placeholder-val="{{ false }}"><input type="radio" name="rt" checked="checked" aria-label="{{r.n}}"></sc-if>
                <sc-if value="{{r.avail}}" hint-placeholder-val="{{ true }}"><input type="radio" name="rt" aria-label="{{r.n}}"></sc-if>
                <sc-if value="{{r.na}}" hint-placeholder-val="{{ false }}"><input type="radio" name="rt" disabled="disabled" aria-label="{{r.n}}"></sc-if>
                <span style="width: 120px">{{r.n}}</span>
                <span style="flex: 1; font-size: 12px; color: var(--muted)">{{r.note}}</span>
              </label>
            </sc-for>
          </div>
          <div style="display: flex; justify-content: space-between; gap: 8px">
            <button style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); font: inherit; font-size: 13px">Back</button>
            <button style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 0; background: var(--accent); color: var(--on-accent); font: inherit; font-size: 13px; font-weight: 600">Continue to review</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const i = (n, cur, b, c) => ({n, b: b || '', c: c || 'var(--muted)', cur: cur ? 'page' : 'false', bg: cur ? 'var(--surface-2)' : 'transparent'});
const SB = {Healthy: 'var(--ok)', Warning: 'var(--warn)', Failed: 'var(--err)', Info: 'var(--info)', Idle: 'var(--muted)', Planned: 'var(--muted)'};
const sb = (label) => ({label, color: SB[label], ok: label === 'Healthy', warn: label === 'Warning', err: label === 'Failed', info: label === 'Info', idle: label === 'Idle', plan: label === 'Planned'});
const tab = (n, count, sel) => ({n, count, sel: sel ? 'true' : 'false', bd: sel ? 'var(--accent)' : 'transparent', fg: sel ? 'var(--text)' : 'var(--muted)'});
const cov = (name, sub, sched, verified, status) => ({name, sub, sched, verified, sb: sb(status), gap: sched === 'Not scheduled', moreLabel: 'More actions for ' + name});
const step = (n, k) => ({n, fg: k === 'cur' ? 'var(--text)' : 'var(--muted)', bd: k === 'done' ? 'var(--ok)' : (k === 'cur' ? 'var(--accent)' : 'var(--border)')});
const rt = (n, note, state) => ({n, note, on: state === 'on', avail: state === 'ok', na: state === 'na', bd: state === 'on' ? 'var(--accent)' : 'var(--border)', fg: state === 'na' ? 'var(--muted)' : 'var(--text)'});
return {
groups: [
{name: 'DASHBOARDS', items: [i('Home control'), i('Media')]},
{name: 'MANAGE', items: [i('Topology'), i('Inventory'), i('Plugins', false, '2 updates', 'var(--info)'), i('Backups', true, '2 gaps', 'var(--warn)'), i('Jobs'), i('People')]},
{name: 'SHARED', items: [i('Family')]}
],
footer: [i('Account'), i('Settings')],
tabs: [tab('Coverage', '7', true), tab('Schedules', '2'), tab('Destinations', '2')],
coverage: [
cov('Media player · Plex', 'Config and database · mimir', 'Nightly services', 'Checksums match · 03:41', 'Healthy'),
cov('TV downloader · Sonarr', 'Config · baldur', 'Nightly services', 'Garage copy mismatch', 'Failed'),
cov('Home automation · Home Assistant', 'Full snapshot · thor', 'Weekly systems', 'Checksums match · Sun 05:12', 'Healthy'),
cov('Audiobooks · Audiobookshelf', 'Config · freyr', 'Nightly services', 'Checksums match · 03:41', 'Healthy'),
cov('DNS filtering · AdGuard', 'Config · loki', 'Nightly services', 'Checksums match · 03:41', 'Healthy'),
cov('Music player · Navidrome', 'Database · njord', 'Not scheduled', 'Never', 'Warning'),
cov('Download client · qBittorrent', 'Config · baldur', 'Not scheduled', 'Never', 'Warning')
],
steps: [step('Choose backup', 'done'), step('Choose target', 'cur'), step('Review', ''), step('Restore', '')],
runtimes: [
rt('Docker', 'Supported · current runtime', 'on'),
rt('Podman', 'Supported', 'ok'),
rt('LXC', 'Supported on Proxmox hosts', 'ok'),
rt('VM', 'Supported · needs 4 GB memory', 'ok'),
rt('Apple containers', 'Not available on njord · Mac only', 'na')
]
};
}
}
</script>
</body>
</html>
