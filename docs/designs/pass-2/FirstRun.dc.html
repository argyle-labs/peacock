<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--bg:#0F1115;--surface:#171A21;--surface-2:#1E222B;--border:#262A33;--text:#E6E8EC;--muted:#9BA1AD;--accent:#7C8CFF;--on-accent:#0F1115;--ok:#3FB68B;--warn:#E0A340;--err:#E5636B;--info:#6FA8FF}
body{margin:0}
a{color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-mask-image:linear-gradient(90deg,black 85%,transparent)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column">
  <header style="height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--border); flex: none">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; color: var(--text)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <div style="flex: 1; font-weight: 600; font-size: 16px">Set up orca</div>
    <button aria-label="More options" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; color: var(--text)"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
  </header>
  <div style="flex: 1; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; overflow: auto">
  <ol aria-label="Progress" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 8px">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
      <li aria-current="{{s.current}}" style="flex: 1; display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 2px; background: {{s.bar}}"></span><span style="font-size: 12px; color: {{s.fg}}">{{s.n}}. {{s.label}}</span></li>
    </sc-for>
  </ol>
    <div><div style="font-size: 22px; font-weight: 600">Create your account</div><div style="font-size: 14px; color: var(--muted); margin-top: 4px">You will be the first admin. Next you can add two-factor (optional), then pick machines.</div></div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="code" style="font-size: 13px; color: var(--muted)">Setup code</label>
      <input id="code" autocomplete="one-time-code" aria-invalid="{{codeBad}}" aria-describedby="code-err" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; border-color: {{codeBorder}}" value="">
      <sc-if value="{{codeBad}}" hint-placeholder-val="{{ false }}">
        <div id="code-err" role="alert" style="display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--err)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg><span>{{codeMsg}}</span></div>
      </sc-if>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="name" style="font-size: 13px; color: var(--muted)">Name</label>
      <input id="name" autocomplete="name" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit" value="">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="email" style="font-size: 13px; color: var(--muted)">Email</label>
      <input id="email" type="email" autocomplete="email" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit" value="">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pw" style="font-size: 13px; color: var(--muted)">Password</label>
      <div style="position: relative">
        <input id="pw" type="password" autocomplete="new-password" aria-describedby="pw-hint" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; padding-right: 52px" value="">
        <button aria-label="Show password" aria-pressed="false" style="position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
      <div id="pw-hint" style="display: flex; gap: 8px; align-items: center"><span style="flex: 1; display: flex; gap: 4px"><span style="flex: 1; height: 4px; border-radius: 2px; background: var(--border)"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: var(--border)"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: var(--border)"></span></span><span style="font-size: 12px; color: var(--muted)">Use 12+ characters or a passphrase</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pw2" style="font-size: 13px; color: var(--muted)">Confirm password</label>
      <div style="position: relative">
        <input id="pw2" type="password" autocomplete="new-password" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; padding-right: 52px" value="">
        <button aria-label="Show password" aria-pressed="false" style="position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
    </div>
  </div>
  <div style="padding: 12px 24px 24px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px">
    <button style="height: 50px; border-radius: 10px; border: 0; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600">Continue</button>
    <button style="height: 44px; border: 0; background: transparent; color: var(--accent); font: inherit; font-weight: 500">Cancel setup</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"select","default":"empty","options":["empty","expired-code","invalid-code"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.props.state ?? 'empty';
const bad = st !== 'empty';
return {
codeBad: bad,
codeBorder: bad ? 'var(--err)' : 'var(--border)',
codeMsg: st === 'expired-code' ? 'This setup code has expired. Run the setup command again for a new one.' : 'That setup code is not valid. Check it and try again.',
steps: [
{n:1, label:'Account', bar:'var(--accent)', fg:'var(--text)', current:'step'},
{n:2, label:'Security (optional two-factor)', bar:'var(--border)', fg:'var(--muted)', current:'false'},
{n:3, label:'Machines', bar:'var(--border)', fg:'var(--muted)', current:'false'}
]
};
}
}
</script>
</body>
</html>
