<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawer menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--bg:#0F1115;--surface:#171A21;--surface-2:#1E222B;--border:#262A33;--text:#E6E8EC;--muted:#9BA1AD;--accent:#7C8CFF;--on-accent:#0F1115;--ok:#3FB68B;--warn:#E0A340;--err:#E5636B;--info:#6FA8FF}
body{margin:0}
a{color:var(--accent)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 15px; overflow: hidden">
  <button aria-label="Close menu" style="position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); opacity: .7"></button>
  <nav aria-label="Main" style="position: absolute; top: 0; left: 0; bottom: 0; width: 312px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 12px; box-sizing: border-box; gap: 2px; overflow-y: auto">
    <div style="display: flex; gap: 6px; margin-bottom: 12px">
      <button aria-label="Switch mesh" style="flex: 1; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; text-align: left">
        <span style="width: 24px; height: 24px; border-radius: 6px; background: var(--accent)"></span>
        <span style="flex: 1"><span style="display: block; font-weight: 600">home</span><span style="display: block; font-size: 12px; color: var(--muted)">5 systems · all reachable</span></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <button aria-label="Close menu" style="width: 44px; min-height: 48px; border-radius: 10px; border: 0; background: transparent; color: var(--text)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div>
        <div style="font-size: 12px; color: var(--muted); padding: 12px 12px 4px; letter-spacing: .04em">{{g.name}}</div>
        <sc-for list="{{g.items}}" as="i" hint-placeholder-count="4">
          <a href="#" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--text); text-decoration: none"><span>{{i.n}}</span><span style="font-size: 12px; color: {{i.c}}">{{i.b}}</span></a>
        </sc-for>
      </div>
    </sc-for>
    <div style="flex: 1"></div>
    <div style="border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px">
      <a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--text); text-decoration: none">Account</a>
      <a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--text); text-decoration: none">Settings</a>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const i = (n, b, c) => ({n, b: b || '', c: c || 'var(--muted)'});
return { groups: [
{name: 'DASHBOARDS', items: [i('Home control'), i('Media')]},
{name: 'MANAGE', items: [i('Topology'), i('Containers & VMs'), i('Services'), i('Plugins', '2 updates', 'var(--info)'), i('Backups'), i('Jobs', '1 running')]},
{name: 'SHARED', items: [i('Family media')]}
]};
}
}
</script>
</body>
</html>
