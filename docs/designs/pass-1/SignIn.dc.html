<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}a{color:#A9B4FF}a:hover{color:#C9D0FF}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; color: #E6E8EC; font-family: Inter, system-ui, sans-serif; font-size: 15px; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; align-items: center; gap: 10px">
    <div style="width: 32px; height: 32px; border-radius: 8px; background: #7C8CFF"></div>
    <div style="font-weight: 600">orca · home</div>
    <div style="flex: 1"></div>
    <button style="height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid #333844; background: #171A21; color: #C3C8D1; font: inherit; font-size: 13px">Switch mesh</button>
  </div>
  <h1 style="margin: 24px 0 0; font-size: 24px; font-weight: 600">Enter your code</h1>
  <div style="color: #9BA1AD; line-height: 1.5">Signed in as scott@example.com. Open your authenticator app for the 6-digit code.</div>
  <div style="display: flex; gap: 8px" role="group" aria-label="6-digit code">
    <sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
      <input aria-label="Digit" value="{{d}}" style="width: 48px; height: 56px; text-align: center; border-radius: 8px; border: 1px solid #333844; background: #171A21; color: #E6E8EC; font: inherit; font-size: 22px">
    </sc-for>
  </div>
  <label style="display: flex; gap: 10px; align-items: center; color: #C3C8D1; font-size: 14px"><input type="checkbox"> Trust this device for 30 days</label>
  <div style="flex: 1"></div>
  <button style="height: 50px; border-radius: 10px; border: 0; background: #7C8CFF; color: #0F1115; font: inherit; font-weight: 600">Verify</button>
  <a href="#" style="text-align: center; font-size: 14px">Use a recovery code</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { digits: ['4','8','1','','',''] }; }
}
</script>
</body>
</html>
