<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approve fix</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}a{color:#A9B4FF}a:hover{color:#C9D0FF}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; color: #E6E8EC; font-family: Inter, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; padding: 16px; gap: 14px">
  <header style="display: flex; align-items: center; gap: 10px">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #262A33; background: #171A21; color: #E6E8EC">‹</button>
    <h1 style="margin: 0; font-size: 18px; font-weight: 600">Notification</h1>
  </header>
  <div style="display: flex; gap: 8px"><span style="font-size: 12px; padding: 3px 8px; border-radius: 10px; background: #3A1E22; color: #F2B8BD">storage</span><span style="font-size: 12px; padding: 3px 8px; border-radius: 10px; background: #2C2716; color: #EFD49A">fix needs approval</span></div>
  <div><div style="font-size: 20px; font-weight: 600; line-height: 1.3">/mnt/data unreachable on loki</div><div style="font-size: 13px; color: #9BA1AD; margin-top: 6px">Mount source willow stopped answering 14 min ago. Seen 3 times, grouped.</div></div>
  <div style="font-size: 12px; color: #9BA1AD; letter-spacing: .04em">PROPOSED FIX</div>
  <div style="border: 1px solid #262A33; border-radius: 10px; background: #171A21; padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 14px">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
      <div style="display: flex; gap: 10px"><span style="color: #9BA1AD; width: 16px">{{s.n}}</span><span>{{s.t}}</span></div>
    </sc-for>
  </div>
  <div style="font-size: 13px; color: #9BA1AD; line-height: 1.5">Rolls back if any step fails. Affects adguard backups on loki.</div>
  <div style="flex: 1"></div>
  <div style="display: flex; gap: 10px">
    <button style="flex: 1; height: 50px; border-radius: 10px; border: 1px solid #333844; background: #171A21; color: #E6E8EC; font: inherit">Deny</button>
    <button style="flex: 2; height: 50px; border-radius: 10px; border: 0; background: #7C8CFF; color: #0F1115; font: inherit; font-weight: 600">Approve fix</button>
  </div>
  <div style="font-size: 12px; color: #9BA1AD; text-align: center">Policy: storage failover · require approval (admin setting)</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { steps: [
{n:'1', t:'Switch /mnt/data route to maple'},
{n:'2', t:'Unmount the stale willow layer'},
{n:'3', t:'Mount from maple and verify a read'},
{n:'4', t:'Restart adguard so its bind follows'}
]};
}
}
</script>
</body>
</html>
