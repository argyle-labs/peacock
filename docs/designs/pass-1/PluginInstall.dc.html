<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Install plugin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}a{color:#A9B4FF}a:hover{color:#C9D0FF}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; color: #E6E8EC; font-family: Inter, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; padding: 16px; gap: 14px">
  <header style="display: flex; align-items: center; gap: 10px">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #262A33; background: #171A21; color: #E6E8EC">‹</button>
    <h1 style="margin: 0; font-size: 18px; font-weight: 600">Install plugin</h1>
  </header>
  <div style="display: flex; gap: 12px; align-items: center">
    <div style="width: 48px; height: 48px; border-radius: 12px; background: #232836"></div>
    <div style="flex: 1"><div style="font-weight: 600">Home Assistant</div><div style="font-size: 12px; color: #9BA1AD">v0.9.2 · stable · argyle-labs source</div></div>
    <span style="font-size: 12px; color: #3FB68B">signature valid</span>
  </div>
  <div style="padding: 10px 12px; border-radius: 10px; background: #1A2130; border: 1px solid #2B3A5A; font-size: 13px; color: #C9D3EA">Suggested: orca found Home Assistant running on 10.0.0.20.</div>
  <div style="font-size: 12px; color: #9BA1AD; letter-spacing: .04em">IT WILL BE ABLE TO</div>
  <div style="border: 1px solid #262A33; border-radius: 10px; background: #171A21">
    <sc-for list="{{perms}}" as="p" hint-placeholder-count="4">
      <div style="display: flex; gap: 10px; padding: 12px; border-top: 1px solid {{p.line}}; font-size: 14px"><span style="color: {{p.c}}">●</span><div><div>{{p.t}}</div><div style="font-size: 12px; color: #9BA1AD">{{p.s}}</div></div></div>
    </sc-for>
  </div>
  <div style="font-size: 12px; color: #9BA1AD; letter-spacing: .04em">INSTALL ON</div>
  <sc-for list="{{hosts}}" as="h" hint-placeholder-count="3">
    <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #262A33; background: #171A21"><input type="checkbox" checked="{{h.on}}"><span style="flex: 1">{{h.n}}</span><span style="font-size: 12px; color: #9BA1AD">{{h.s}}</span></label>
  </sc-for>
  <div style="flex: 1"></div>
  <button style="height: 50px; border-radius: 10px; border: 0; background: #7C8CFF; color: #0F1115; font: inherit; font-weight: 600">Install on 1 machine</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
perms: [
{t:'Read and control devices', s:'Lights, media players, sensors', c:'#E0A340', line:'transparent'},
{t:'Create user accounts', s:'For people you grant Home access', c:'#E0A340', line:'#22262E'},
{t:'Store one API token', s:'Kept in orca secrets', c:'#9BA1AD', line:'#22262E'},
{t:'Contribute widgets and dashboards', s:'Shown only to grant holders', c:'#9BA1AD', line:'#22262E'}
],
hosts: [
{n:'thor', s:'recommended · same subnet', on:true},
{n:'loki', s:'gateway', on:false},
{n:'mimir', s:'', on:false}
]
};
}
}
</script>
</body>
</html>
