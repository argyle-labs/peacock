<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Media request</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}a{color:#A9B4FF}a:hover{color:#C9D0FF}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; color: #E6E8EC; font-family: Inter, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 10px; padding: 16px">
    <button aria-label="Open menu" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #262A33; background: #171A21; color: #E6E8EC"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    <label for="q3" style="flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; background: #171A21; border: 1px solid #7C8CFF; border-radius: 10px; padding: 0 12px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9BA1AD" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q3" value="dune" style="flex: 1; background: transparent; border: 0; color: #E6E8EC; font: inherit; outline: none">
    </label>
  </header>
  <div style="padding: 0 16px 8px; font-size: 12px; color: #9BA1AD">MEDIA</div>
  <sc-for list="{{items}}" as="m" hint-placeholder-count="4">
    <div style="display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid #1C2028">
      <div style="width: 48px; height: 72px; border-radius: 6px; background: #232836"></div>
      <div style="flex: 1; min-width: 0"><div style="font-weight: 500">{{m.t}}</div><div style="font-size: 12px; color: #9BA1AD">{{m.s}}</div><div style="font-size: 12px; color: {{m.sc}}; margin-top: 4px">{{m.state}}</div></div>
      <sc-if value="{{m.can}}" hint-placeholder-val="{{ true }}"><button style="height: 36px; padding: 0 14px; border-radius: 8px; border: 0; background: #7C8CFF; color: #0F1115; font: inherit; font-size: 14px; font-weight: 600">Request</button></sc-if>
    </div>
  </sc-for>
  <div style="margin: 16px; padding: 12px; border-radius: 10px; border: 1px solid #262A33; background: #171A21; font-size: 13px; color: #C3C8D1; line-height: 1.5">Your requests need admin approval. You'll get a notification when it's ready.</div>
  <div style="flex: 1"></div>
  <a href="#" style="display: block; text-align: center; padding: 16px; font-size: 14px">My requests (2)</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { items: [
{t:'Dune: Part Two', s:'Movie · 2024', state:'In your library · Plex', sc:'#3FB68B', can:false},
{t:'Dune: Prophecy', s:'TV · 1 season', state:'Requested · waiting for approval', sc:'#E0A340', can:false},
{t:'Dune', s:'Book · Frank Herbert', state:'Not in library', sc:'#9BA1AD', can:true},
{t:'Dune Messiah', s:'Audiobook', state:'Not in library', sc:'#9BA1AD', can:true}
]};
}
}
</script>
</body>
</html>
