<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reveal secret</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}a{color:#A9B4FF}a:hover{color:#C9D0FF}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: #0F1115; color: #E6E8EC; font-family: Inter, system-ui, sans-serif; font-size: 15px; overflow: hidden">
  <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <header style="display: flex; align-items: center; gap: 10px">
      <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #262A33; background: #171A21; color: #E6E8EC">‹</button>
      <h1 style="margin: 0; font-size: 18px; font-weight: 600">Plex token</h1>
    </header>
    <div style="padding: 12px; border-radius: 10px; border: 1px solid #262A33; background: #171A21; display: flex; flex-direction: column; gap: 8px; font-size: 14px">
      <div style="display: flex; justify-content: space-between"><span style="color: #9BA1AD">Value</span><span style="letter-spacing: .2em">••••••••••••</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #9BA1AD">Used by</span><span>Plex · mimir, njord</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #9BA1AD">Rotated</span><span>41 days ago</span></div>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.6)"></div>
  <div role="dialog" aria-label="Confirm it's you" style="position: absolute; left: 0; right: 0; bottom: 0; background: #171A21; border-top: 1px solid #333844; border-radius: 16px 16px 0 0; padding: 24px 20px 32px; display: flex; flex-direction: column; gap: 14px">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #333844; align-self: center"></div>
    <div style="font-size: 18px; font-weight: 600">Confirm it's you</div>
    <div style="font-size: 14px; color: #9BA1AD; line-height: 1.5">Viewing a secret needs your authenticator code, even with the view-secrets grant. This view is recorded in the audit log.</div>
    <label for="otp" style="font-size: 13px; color: #C3C8D1">6-digit code</label>
    <input id="otp" inputmode="numeric" placeholder="000000" style="height: 52px; border-radius: 10px; border: 1px solid #7C8CFF; background: #0F1115; color: #E6E8EC; font: inherit; font-size: 22px; letter-spacing: .3em; padding: 0 14px">
    <button style="height: 50px; border-radius: 10px; border: 0; background: #7C8CFF; color: #0F1115; font: inherit; font-weight: 600">Reveal for 60 seconds</button>
    <button style="height: 44px; border-radius: 10px; border: 0; background: transparent; color: #C3C8D1; font: inherit">Use password instead</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
