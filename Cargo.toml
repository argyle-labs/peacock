[package]
name = "peacock"
version = "0.1.0"
edition = "2024"
description = "orca web-UI plugin — serves the brain-site frontend at the root route as an out-of-process plugin."
license = "MIT"

[package.metadata.orca]
# Consumed by the labs org-index generator; keeps the org profile self-building.
category = "frontend"

# A subprocess plugin is an executable, not a cdylib: orca's boot-time scan
# spawns it and speaks the UDS wire protocol to it.
[[bin]]
name = "peacock"
path = "src/main.rs"

[dependencies]
# THIN PROFILE: peacock authors one tool (`peacock.render`) via `#[orca_tool]`
# and serves over the subprocess loop, so it needs only the `tools` + `db`
# features (the latter gates `serve()`) — never the `full` default that pulls
# containers(bollard)/graphql/openapi(progenitor) into the artifact.
#
# All three orca crates resolve from the pinned git source; the committed
# `[patch]` in `.cargo/config.toml` redirects them to a local `../orca` checkout
# for development. `contract` + `derive` are needed directly because the
# `#[orca_tool]` surface and the typed `contract::web::{WebRequest,WebResponse}`
# request/response types are referenced in plugin source.
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", branch = "main", default-features = false, features = ["tools", "db"] }
contract = { git = "https://github.com/argyle-labs/orca", branch = "main", default-features = false }
derive = { git = "https://github.com/argyle-labs/orca", branch = "main" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
base64 = "0.22"
mime_guess = "2"
rust-embed = "8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tracing = "0.1"
